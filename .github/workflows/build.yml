name: REMOCAR 3D CI/CD & Android APK Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Dependencies
      run: npm install --legacy-peer-deps

    - name: Run Production Build (Web & 3D Assets)
      run: npm run build

    - name: Prepare Android Web Assets
      run: |
        mkdir -p android/app/src/main/assets/public
        cp -r dist/* android/app/src/main/assets/public/

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Build Android APK (Gradle assembleRelease)
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleRelease

    - name: Upload APK & Web Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: remocar-3d-apk-release
        path: |
          dist/
          android/app/build/outputs/apk/release/
